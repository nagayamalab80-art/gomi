<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ごみの日">
<meta name="theme-color" content="#0a5560">
<title>ごみの日(北茨城・高萩)</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --z:1;
  --bg:#f2f5f3;--fg:#13201a;--muted:#56645b;--card:#ffffff;--line:#dce4de;
  --burn:#a83800;--burn-bg:#ffe5d3;
  --nb:#0f4f9c;--nb-bg:#dfecfb;
  --res:#17692c;--res-bg:#d9f2e0;
  --pet:#00606e;--pet-bg:#d3f0f4;
  --bin:#7a4f00;--bin-bg:#fdebc8;
  --big:#5b22a8;--big-bg:#ece1fa;
  --haz:#a4190f;--haz-bg:#fde3e0;
  --carry:#3d4650;--carry-bg:#e6e9ed;
  --ng:#6a3512;--ng-bg:#f3e3d6;
  --sat:#1558a8;--sun:#b3261e;
  --accent:#0b6b5c;--accent-fg:#ffffff;
  --h1:#0a5560;--h2:#1f8a4f;
  --warn-bg:#fff3bf;--warn:#6b4e00;
  --shadow:0 10px 26px -10px rgba(10,40,25,.35);
  --shadow-s:0 4px 14px -6px rgba(10,40,25,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1311;--fg:#f2f7f4;--muted:#a4b3aa;--card:#16201c;--line:#26342d;
    --burn:#ffb98a;--burn-bg:#4a2d18;
    --nb:#9ccfff;--nb-bg:#19304a;
    --res:#8fe5a1;--res-bg:#173a25;
    --pet:#7fdcec;--pet-bg:#143b44;
    --bin:#ffd27a;--bin-bg:#45340f;
    --big:#d3b5ff;--big-bg:#35244f;
    --haz:#ffa8a0;--haz-bg:#4d2321;
    --carry:#d3dae2;--carry-bg:#2a313a;
    --ng:#f2c9aa;--ng-bg:#3d2b1f;
    --sat:#8cc8ff;--sun:#ff9b94;
    --accent:#4fd1b5;--accent-fg:#04231c;
    --h1:#06343b;--h2:#0f5d36;
    --warn-bg:#4a3c0a;--warn:#ffe89a;
    --shadow:0 10px 26px -10px rgba(0,0,0,.7);--shadow-s:0 4px 14px -6px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1311;--fg:#f2f7f4;--muted:#a4b3aa;--card:#16201c;--line:#26342d;
  --burn:#ffb98a;--burn-bg:#4a2d18;--nb:#9ccfff;--nb-bg:#19304a;--res:#8fe5a1;--res-bg:#173a25;
  --pet:#7fdcec;--pet-bg:#143b44;--bin:#ffd27a;--bin-bg:#45340f;--big:#d3b5ff;--big-bg:#35244f;
  --haz:#ffa8a0;--haz-bg:#4d2321;--carry:#d3dae2;--carry-bg:#2a313a;--ng:#f2c9aa;--ng-bg:#3d2b1f;
  --sat:#8cc8ff;--sun:#ff9b94;--accent:#4fd1b5;--accent-fg:#04231c;--h1:#06343b;--h2:#0f5d36;
  --warn-bg:#4a3c0a;--warn:#ffe89a;--shadow:0 10px 26px -10px rgba(0,0,0,.7);--shadow-s:0 4px 14px -6px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-size:18px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,filter .08s ease}
button:active,summary:active{transform:scale(.97);filter:brightness(.94)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 56px;zoom:var(--z)}
.small{font-size:16px;color:var(--muted)}
.c-center{text-align:center}

/* ===== ホーム: 上の帯 ===== */
.hero{margin:-12px -16px 0;padding:16px 16px 62px;border-radius:0 0 34px 34px;text-align:center;color:#fff;
  background:linear-gradient(155deg,var(--h1) 0%,var(--h2) 100%);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero::after{content:"";position:absolute;left:-80px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.place{display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;min-height:50px;
  background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.7);border-bottom-width:4px;border-radius:999px;padding:8px 20px;font-size:19px;font-weight:900}
.place .pe{font-size:14px;opacity:.9}
.hero .k{margin-top:16px;font-size:20px;font-weight:800;letter-spacing:.2em;opacity:.92}
.hero .date{font-size:62px;font-weight:900;line-height:1.08;letter-spacing:.01em;margin-top:2px}
.hero .wdp{display:inline-block;margin-top:8px;background:#fff;color:var(--fg);font-size:28px;font-weight:900;border-radius:999px;padding:2px 26px;line-height:1.35}
.hero .wdp.sat{color:var(--sat)}.hero .wdp.sun{color:var(--sun)}
.hero .y{margin-top:8px;font-size:15px;opacity:.85}
:root[data-theme="dark"] .hero .wdp,:root:not([data-theme="light"]) .hero .wdp{background:rgba(255,255,255,.92);color:#13201a}

/* ===== きょう/あした のごみ ===== */
.stack{position:relative;margin-top:-40px}
.panel{display:block;border-radius:28px;margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}
.panel.burn{background:var(--burn-bg);color:var(--burn)}
.panel.nb{background:var(--nb-bg);color:var(--nb)}
.panel.res{background:var(--res-bg);color:var(--res)}
.panel.pet{background:var(--pet-bg);color:var(--pet)}
.panel.bin{background:var(--bin-bg);color:var(--bin)}
.panel>summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px 16px;list-style:none;cursor:pointer}
.panel>summary::-webkit-details-marker{display:none}
.panel .ic{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.78);font-size:46px;line-height:1;box-shadow:0 4px 12px -4px rgba(0,0,0,.25)}
.panel .lb{font-size:36px;font-weight:900;line-height:1.25;margin-top:4px}
.panel .mm{font-size:17px;font-weight:700;line-height:1.45}
.panel .more{display:block;width:100%;margin-top:8px;background:rgba(255,255,255,.85);border:2px solid currentColor;border-bottom-width:5px;border-radius:999px;padding:10px 12px;font-size:20px;font-weight:900}
.panel .more .m2{display:none}
.panel[open] .more .m1{display:none}
.panel[open] .more .m2{display:inline}
.panel .dbody{margin:0 14px 14px;background:var(--card);color:var(--fg);border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.7;font-weight:500;text-align:left}
.panel .dbody b{display:block;margin-top:10px}
.panel .dbody b:first-child{margin-top:0}
.panel .dbody .ng{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line);font-weight:700}
.panel.none{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 16px;text-align:center;background:var(--card);color:var(--muted)}
.panel.none .ic{background:var(--bg);box-shadow:none}
.panel.none .lb{font-size:28px}
.panel.sm{box-shadow:var(--shadow-s);border-radius:22px}
.panel.sm>summary{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;padding:14px 12px 12px}
.panel.sm .ic{width:58px;height:58px;font-size:32px}
.panel.sm .lb{font-size:26px;margin-top:0}
.panel.sm .mm{flex-basis:100%;font-size:15px}
.panel.sm .more{font-size:16px;padding:7px 10px;margin-top:4px}
.panel.sm.none{flex-direction:row;justify-content:center;padding:14px}
.panel.sm.none .lb{font-size:22px}
.note{display:block;width:fit-content;margin:14px auto 0;background:var(--card);border-radius:999px;padding:6px 18px;font-size:19px;font-weight:800;box-shadow:var(--shadow-s)}
.sect{display:flex;align-items:center;gap:12px;margin:26px 0 0;font-size:21px;font-weight:900;color:var(--fg)}
.sect::before,.sect::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}

/* ===== ボタン ===== */
.cta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;margin-top:22px;padding:20px 12px 18px;border:0;border-bottom:7px solid rgba(0,0,0,.28);border-radius:28px;
  background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;box-shadow:var(--shadow);text-align:center}
.cta:active{border-bottom-width:3px;transform:translateY(4px)}
.cta .ct{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;line-height:1.25}
.cta .mg{margin-right:12px;position:relative;left:-6px;font-size:40px}
.cta .cs{font-size:20px;font-weight:800}
.cta .cn{font-size:16px;font-weight:700;opacity:.92}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px 14px;border:2px solid var(--line);border-bottom:6px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow-s);min-height:124px}
.tile:active{border-bottom-width:2px;transform:translateY(4px)}
.tile .ti{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--bg);font-size:32px;line-height:1}
.tile .tl{font-size:21px;font-weight:900;line-height:1.3;text-align:center}
.notebar{display:block;width:100%;margin-top:18px;padding:14px;border:2px solid var(--accent);border-radius:20px;background:var(--card);color:var(--accent);font-size:20px;font-weight:900;text-align:center}
.btn{display:block;width:100%;font-size:22px;font-weight:900;padding:16px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);margin-top:10px;text-align:center}
.btn.sub{background:var(--bg);color:var(--fg);border:2px solid var(--line);font-size:19px;padding:13px}
.back{position:sticky;top:0;z-index:5;display:block;width:100%;text-align:center;font-size:23px;font-weight:900;padding:15px 16px;border-radius:20px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);box-shadow:var(--shadow-s);margin-bottom:14px}
h1{font-size:28px;margin:8px 0 14px;line-height:1.3;text-align:center}
h2{font-size:21px;margin:0 0 8px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:20px;padding:14px 16px;margin-top:14px;font-size:19px;font-weight:800;text-align:center}
.alert button{display:block;width:100%;margin-top:10px;font-size:19px;font-weight:900;padding:12px;border-radius:14px;border:2px solid currentColor;background:transparent}
.box{background:var(--card);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--shadow-s)}
.box h2{margin-bottom:10px}
.notice{background:var(--carry-bg);color:var(--carry);border-radius:20px;padding:16px;margin-top:14px;font-size:19px;font-weight:700;line-height:1.65;text-align:center}
.bl{margin:6px 0 0;padding-left:22px;font-size:18px;line-height:1.65}
.bl li{margin:8px 0}
a.tel{display:inline-block;font-size:28px;font-weight:900;color:var(--accent);text-decoration:none;margin-top:6px}
.cur{font-size:22px;font-weight:900;margin-bottom:4px}
.stat{display:inline-block;background:var(--res-bg);color:var(--res);font-weight:900;border-radius:999px;padding:4px 16px;font-size:19px}

/* ===== えらぶ(市・町・地区) ===== */
.choice{display:block;width:100%;text-align:center;font-size:28px;font-weight:900;padding:20px 16px;margin-top:12px;border-radius:24px;border:0;background:var(--card);box-shadow:var(--shadow-s)}
.choice small{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-top:4px}
.choice.long{font-size:21px;line-height:1.5;text-align:left}
.choice.long small{font-size:17px;font-weight:800;color:var(--accent)}
.seg{display:flex;gap:8px}
.sg{flex:1;font-size:19px;font-weight:900;padding:14px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card);line-height:1.3}
.sg.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* ===== 検索 ===== */
.sbox{display:flex;gap:8px;margin-top:4px}
.sbox input{flex:1;min-width:0;font-size:26px;padding:14px;border-radius:18px;border:3px solid var(--accent);background:var(--card);color:var(--fg)}
.sbox button{flex:none;font-size:22px;font-weight:900;padding:0 16px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow-s)}
.hint{font-size:16px;color:var(--muted);margin:8px 2px 0;text-align:center}
.kanahead{font-size:18px;font-weight:900;margin:20px 2px 8px;text-align:center}
.kana{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kb{font-size:24px;font-weight:900;padding:12px 0;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow-s)}
.kb.on{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.chipb{font-size:21px;font-weight:800;padding:10px 16px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow-s)}
.cnt{font-size:17px;font-weight:700;color:var(--muted);margin-top:16px;text-align:center}
.srcnote{font-size:15px;color:var(--muted);margin-top:14px;line-height:1.55}
.ans{border-radius:24px;padding:18px 16px;margin-top:14px;text-align:center;box-shadow:var(--shadow-s)}
.ans.burn{background:var(--burn-bg);color:var(--burn)}
.ans.nb{background:var(--nb-bg);color:var(--nb)}
.ans.res{background:var(--res-bg);color:var(--res)}
.ans.pet{background:var(--pet-bg);color:var(--pet)}
.ans.bin{background:var(--bin-bg);color:var(--bin)}
.ans.big{background:var(--big-bg);color:var(--big)}
.ans.haz{background:var(--haz-bg);color:var(--haz)}
.ans.carry{background:var(--carry-bg);color:var(--carry)}
.ans.ng{background:var(--ng-bg);color:var(--ng)}
.ans .nm{font-size:23px;font-weight:900;line-height:1.35;color:var(--fg)}
.ans .is{font-size:16px;font-weight:700;margin-top:10px}
.ans .lab{display:flex;align-items:center;justify-content:center;gap:10px;font-size:30px;font-weight:900;line-height:1.3;margin-top:2px}
.ans .lab .ic{flex:none;font-size:36px;line-height:1.2}
.ans .lab .de{font-size:20px;font-weight:800}
.when{background:var(--card);color:var(--fg);border-radius:18px;padding:14px;margin-top:12px;text-align:center}
.when .wl{font-size:15px;font-weight:800;color:var(--muted)}
.when .wdate{font-size:32px;font-weight:900;line-height:1.3}
.when .wrel{display:inline-block;font-size:20px;font-weight:900;color:var(--accent-fg);background:var(--accent);border-radius:999px;padding:0 16px;margin-top:2px}
.when .wn{font-size:14px;color:var(--muted);margin-top:4px}
.ans .how{font-size:17px;font-weight:600;margin-top:12px;line-height:1.6;text-align:left}
.ans .nt{font-size:16px;font-weight:600;margin-top:10px;padding-top:8px;border-top:1px dashed currentColor;line-height:1.55;text-align:left}
.drow{background:var(--card);border-radius:18px;margin-top:8px;overflow:hidden;box-shadow:var(--shadow-s)}
.drow>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;list-style:none;cursor:pointer}
.drow>summary::-webkit-details-marker{display:none}
.drow .dn{flex:1;min-width:0;font-size:20px;font-weight:800;line-height:1.35}
.drow .dl{flex:none;max-width:48%;font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;line-height:1.35;text-align:center}
.drow .dl.burn{background:var(--burn-bg);color:var(--burn)}.drow .dl.nb{background:var(--nb-bg);color:var(--nb)}
.drow .dl.res{background:var(--res-bg);color:var(--res)}.drow .dl.pet{background:var(--pet-bg);color:var(--pet)}
.drow .dl.bin{background:var(--bin-bg);color:var(--bin)}.drow .dl.big{background:var(--big-bg);color:var(--big)}
.drow .dl.haz{background:var(--haz-bg);color:var(--haz)}.drow .dl.carry{background:var(--carry-bg);color:var(--carry)}
.drow .dl.ng{background:var(--ng-bg);color:var(--ng)}
.drow .ans{margin:0 10px 10px;box-shadow:none}
.drow .ans .nm{display:none}
.drow .ans .is{margin-top:4px}

/* ===== こんなとき ===== */
.xrow{background:var(--card);border-radius:20px;margin-top:10px;overflow:hidden;box-shadow:var(--shadow-s)}
.xrow>summary{display:flex;align-items:center;gap:12px;padding:14px;list-style:none;cursor:pointer}
.xrow>summary::-webkit-details-marker{display:none}
.xi{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--bg);font-size:26px}
.xt{flex:1;min-width:0;font-size:20px;font-weight:900;line-height:1.35}
.xc{flex:none;font-size:18px;color:var(--muted)}
.xrow[open] .xc{transform:rotate(180deg)}
.xb{padding:2px 16px 16px;font-size:17px;line-height:1.7}
.xb p{margin:8px 0}
.xb ul,.xb ol{margin:6px 0;padding-left:22px}
.xb li{margin:6px 0}
.xb a.t{color:var(--accent);font-weight:900;text-decoration:none;white-space:nowrap}
.xb .s{font-size:14px;color:var(--muted)}

/* ===== よてい・カレンダー ===== */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:18px}
.row:first-of-type{border-top:0}
.row .d{width:86px;flex:none;color:var(--muted)}
.row .d b{color:var(--fg);font-size:20px}
.chip{font-size:16px;font-weight:800;padding:3px 10px;border-radius:999px;display:inline-block;margin:2px 4px 2px 0}
.chip.burn{background:var(--burn-bg);color:var(--burn)}.chip.nb{background:var(--nb-bg);color:var(--nb)}
.chip.res{background:var(--res-bg);color:var(--res)}.chip.pet{background:var(--pet-bg);color:var(--pet)}
.chip.bin{background:var(--bin-bg);color:var(--bin)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh button{background:var(--bg);border:0;border-radius:14px;font-size:22px;padding:6px 20px}
.mh span{font-weight:900;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:13px;color:var(--muted);text-align:center}
.cal .h:first-child{color:var(--sun)}.cal .h:nth-child(7){color:var(--sat)}
.c{min-height:58px;border-radius:10px;background:var(--bg);padding:3px;display:flex;flex-direction:column;gap:2px}
.c.e{background:transparent}
.c.today{outline:3px solid var(--accent)}
.c .n{font-size:13px;color:var(--muted)}
.c i{font-style:normal;font-size:12px;font-weight:900;text-align:center;border-radius:4px;padding:1px 0}
.c i.burn{background:var(--burn-bg);color:var(--burn)}.c i.nb{background:var(--nb-bg);color:var(--nb)}
.c i.res{background:var(--res-bg);color:var(--res)}.c i.pet{background:var(--pet-bg);color:var(--pet)}
.c i.bin{background:var(--bin-bg);color:var(--bin)}
.c.off .n::after{content:" 休";color:var(--muted)}
.legend{margin-top:8px;text-align:center}
.when.simple{border:2px solid var(--line)}
details.plain{margin-top:14px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow-s)}
details.plain{text-align:center}
details.plain summary{font-weight:900;font-size:19px;cursor:pointer;text-align:center;list-style:none}
details.plain summary::-webkit-details-marker{display:none}
details.plain ul{margin:8px auto 0;padding-left:22px;font-size:17px;display:inline-block;text-align:left}
details.plain li{margin:6px 0}
select{width:100%;font-size:22px;padding:10px;margin-top:8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
footer{margin-top:26px;text-align:center;font-size:14px;color:var(--muted);line-height:1.7}
footer .ft{margin-top:10px;font-size:15px;color:var(--fg)}
footer a{color:var(--accent);font-weight:900;text-decoration:none}
footer .lab{display:block;margin-top:12px;font-size:12px;font-weight:900;letter-spacing:.28em;color:var(--accent)}

/* ===== v9: きけんなごみ・持ち込み・ホームの検索欄 ===== */
.danger{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;margin-top:16px;padding:16px 12px 14px;
  border:3px solid var(--haz);border-bottom-width:8px;border-radius:26px;background:var(--haz-bg);color:var(--haz);text-align:center;box-shadow:var(--shadow-s)}
.danger:active{border-bottom-width:4px;transform:translateY(4px)}
.danger .dt{display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px;font-weight:900;line-height:1.3}
.danger .di{font-size:36px}
.danger .ds{font-size:16px;font-weight:700}
.danger .dn2{margin-top:4px;background:var(--haz);color:#fff;border-radius:999px;padding:3px 18px;font-size:18px;font-weight:900}
:root[data-theme="dark"] .danger .dn2,:root:not([data-theme="light"]) .danger .dn2{color:#2a0a07}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .danger .dn2{color:#fff}}
.hsearch{margin-top:24px;background:var(--card);border-radius:26px;padding:16px 14px 14px;box-shadow:var(--shadow-s)}
.hsearch .hs-t{text-align:center;font-size:21px;font-weight:900;line-height:1.45;margin-bottom:10px}
.hsearch .ans{box-shadow:none;border:2px solid var(--line)}
.warn{background:var(--haz-bg);color:var(--haz);border:2px solid var(--haz);border-radius:14px;padding:8px 10px;font-weight:900;font-size:18px;margin-bottom:10px;text-align:center}
.xrow.dg{box-shadow:var(--shadow-s),inset 7px 0 0 var(--haz)}
.xrow.dg .xi{background:var(--haz-bg)}
.xs{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:2px}
.nd{background:var(--bg);border-radius:16px;padding:10px 12px;text-align:center;font-size:16px;margin-bottom:10px}
.nd b{display:block;font-size:26px;line-height:1.3}
.nd span{font-weight:800;color:var(--accent)}

/* ===== はじめの設定 ===== */
.sethero{margin:-12px -16px 0;padding:34px 16px 78px;border-radius:0 0 40px 40px;text-align:center;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(155deg,var(--h1) 0%,var(--h2) 100%)}
.sethero::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.sethero::after{content:"";position:absolute;left:-90px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.sethero>*{position:relative;z-index:1}
.appicon{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:104px;height:104px;border-radius:28px;background:#fff;color:var(--h1);
  box-shadow:0 14px 30px -10px rgba(0,0,0,.45);font-weight:900;line-height:1.05}
.appicon span:first-child{font-size:38px}
.appicon span:last-child{font-size:26px;color:var(--h2)}
.sethero .sh1{margin-top:16px;font-size:38px;font-weight:900;letter-spacing:.06em}
.sethero .sh2{margin-top:4px;font-size:18px;font-weight:700;opacity:.95}
.sethero.mini{padding:18px 16px 70px}
.sethero.mini .sh1{margin-top:0;font-size:28px}
.setcard{position:relative;margin:-50px 0 0;background:var(--card);border-radius:32px;padding:18px 14px 20px;box-shadow:var(--shadow)}
.setcard .back{box-shadow:none;background:var(--bg);margin-bottom:10px}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 6px}
.dot{width:38px;height:8px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--accent)}
.stn{margin-left:6px;font-size:15px;font-weight:800;color:var(--muted)}
h1.sq{font-size:27px;margin:10px 0 14px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 8px 18px;border:2px solid var(--line);border-bottom-width:7px;border-radius:26px;background:var(--bg)}
.ccard:active{border-bottom-width:3px;transform:translateY(4px)}
.ccard .cb{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;font-size:40px;font-weight:900;color:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.45)}
.ccard .cb.a{background:linear-gradient(135deg,#0a5560,#1b8a73)}
.ccard .cb.b{background:linear-gradient(135deg,#1f8a4f,#6aa83a)}
.ccard b{font-size:27px;font-weight:900;line-height:1.3;margin-top:4px}
.ccard small{font-size:14px;font-weight:700;color:var(--muted);line-height:1.4;text-align:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tt{padding:22px 6px;border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;background:var(--bg);font-size:26px;font-weight:900}
.tt:active{border-bottom-width:2px;transform:translateY(4px)}
.tt:last-child:nth-child(odd){grid-column:1/-1}
.alist{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.acard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px 16px;border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;background:var(--bg);text-align:center}
.acard:active{border-bottom-width:2px;transform:translateY(4px)}
.acard .an{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:2px 20px;font-size:22px;font-weight:900}
.acard .ap{font-size:18px;font-weight:700;line-height:1.55;color:var(--fg)}
.sethint{text-align:center;margin-top:16px;font-size:15px;color:var(--muted)}

let AC = null;
function tone(f, d, t0, vol, type){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (t0||0);
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
  } catch(e){}
}
function sfx(kind){
  if (!prefs.snd) return;
  switch (kind){
    case 'open':  tone(523,.08,0,.13); tone(784,.12,.07,.13); break;
    case 'close': tone(784,.08,0,.11); tone(523,.12,.07,.11); break;
    case 'back':  tone(392,.07,0,.12); tone(294,.11,.06,.12); break;
    case 'ok':    tone(523,.10,0,.14); tone(659,.10,.09,.14); tone(784,.20,.18,.14); break;
    case 'off':   tone(440,.10,0,.12); tone(330,.16,.09,.12); break;
    default:      tone(700,.06,0,.12,'triangle');
  }
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(kind==='ok' ? [12,40,12] : 10); } catch(e){}
}

// 直近の収集日の朝に、スマホ自身が通知を鳴らす予約をする(iOSの上限64件以内で60件)
async function scheduleNotices(){
  if (!LN || !st) return;
  try {
    const pend = await LN.getPending();
    const old = (pend.notifications || []).filter(n=>n.id!==999001).map(n=>({id:n.id}));
    if (old.length) await LN.cancel({notifications: old});
    if (!nf.on) return;
    const now = new Date(), list = [];
    for (let i=0; i<200 && list.length<60; i++){
      const d = addDays(now,i), at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), nf.h, nf.m);
      if (at <= now) continue;
      const id = +ymd(d);
      if (d.getMonth()===11 && d.getDate()===31){
        list.push({id, title:'年末年始の おしらせ', body:'きょうから1月3日まで、ごみの収集はおやすみです。', schedule:{at, allowWhileIdle:true}});
        continue;
      }
      const t = collect(d);
      if (!t || !t.length) continue;
      const names = t.map(k=>T()[k].label).join('と');
      list.push({id, title:'きょうは '+names+' の日', body:'朝8時までに出します。', schedule:{at, allowWhileIdle:true}});
    }
    if (list.length) await LN.schedule({notifications:list});
  } catch(e){ nf.err = 'お知らせの予約に失敗しました。'; }
}

    if (p.display !== 'granted') p = await LN.requestPermissions();

    await LN.schedule({notifications:[{id:999001, title:'テスト通知', body:'お知らせは、こんなふうに 出ます。', schedule:{at:new Date(Date.now()+10000), allowWhileIdle:true}}]});
    nf.err = '10秒後に、テストの通知が出ます。ホームボタンを押して、待ってください。';

}

/* ================= 収集日の計算 ================= */
function collect(d){
  const m = d.getMonth()+1, day = d.getDate();
  if ((m===12 && day===31) || (m===1 && day<=3)) return null;   // 年末年始
  const w = d.getDay(), n = Math.ceil(day/7), out = [];
  for (const [k, ws, nth] of A().r){
    if (ws.includes(w) && (!nth || nth.includes(n))) out.push(k);
  }
  const ord = C().order;
  return out.sort((x,y)=>ord.indexOf(x)-ord.indexOf(y));
}
const addDays = (d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const sameDay = (a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const md = d => `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]})`;
const jd = d => `${d.getMonth()+1}月${d.getDate()}日(${W[d.getDay()]})`;
function untilLabel(d, now){
  const a = new Date(now.getFullYear(),now.getMonth(),now.getDate()), b = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const n = Math.round((b-a)/86400000);
  return n===0 ? 'きょう(朝8時まで)' : n===1 ? 'あした' : n===2 ? 'あさって' : n+'日後';
}
function nextCollect(key, now){
  const start = now.getHours() < 8 ? 0 : 1;      // 朝8時をすぎたら、きょうの分は数えない
  for (let i=start;i<=70;i++){
    const d = addDays(now,i), t = collect(d);
    if (t && t.includes(key)) return {d, today: sameDay(d,now)};
  }
  return null;
}

const norm = s => s.normalize('NFKC').toLowerCase().replace(/\s+/g,'')
  .replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const INDEX = DICT.map(d=>({d, n:norm(d[0]), r:norm(d[3])}));
function doSearch(q){
  q = norm(q); if (!q) return [];
  const res = [];
  for (const x of INDEX){
    let s = -1;
    if (x.n===q || x.r===q) s = 0;
    else if (x.n.startsWith(q) || x.r.startsWith(q)) s = 1;
    else if (x.n.includes(q) || x.r.includes(q)) s = 2;
    if (s>=0) res.push([s,x.d]);
  }
  res.sort((a,b)=>a[0]-b[0]);
  return res.map(a=>a[1]);
}
const KANA_ROWS = [['あ','あいうえおぁぃぅぇぉゔ'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],['た','たちつてとだぢづでどっ'],['な','なにぬねの'],
  ['は','はひふへほばびぶべぼぱぴぷぺぽ'],['ま','まみむめも'],['や','やゆよゃゅょ'],['ら','らりるれろ'],['わ','わをんゐゑ'],['英数','']];
function rowOf(x){
  const c = x.r.charAt(0);
  for (const [name, chars] of KANA_ROWS) if (chars && chars.includes(c)) return name;
  return '英数';
}
function kanaHTML(row){
  const items = INDEX.filter(x=>rowOf(x)===row).sort((a,b)=>a.r<b.r?-1:a.r>b.r?1:0);
  return `<div class="cnt">「${row}」の ごみ: ${items.length}件(さわると ひらきます)</div>` +
    items.map(x=>{ const c = cardInfo(x.d);
      return `<details class="drow"><summary><span class="dn">${x.d[0]}</span><span class="dl ${c.cls}">${c.ic} ${c.label}</span></summary>${resultCard(x.d)}</details>`;
    }).join('');
}

function nyHTML(){

  let h = backBtn() + '<h1>年末年始の ごみ</h1>';
  h += `<div class="alert" style="margin-top:0">${yr}年12月31日 〜 ${yr+1}年1月3日は、<br>ごみの収集は <u>おやすみ</u> です。</div>`;
  h += '<div class="box"><h2>高北清掃センター(持ち込み)</h2>12月31日〜1月3日は おやすみです。<br>日曜日も おやすみです。</div>';
  let l1='', l2='';
  for (let d=25; d<=30; d++) l1 += dayRow(new Date(yr,11,d));
  for (let d=4; d<=10; d++) l2 += dayRow(new Date(yr+1,0,d));
  h += `<div class="box"><h2>年末の収集(${placeLabel()})</h2>${l1}<div class="small" style="margin-top:6px">12月30日が 今年さいごの収集日です。</div></div>`;
  h += `<div class="box"><h2>年始の収集(${placeLabel()})</h2>${l2}<div class="small" style="margin-top:6px">1月4日から 曜日どおりに 収集します。</div></div>`;
  h += `<div class="box small">${C().holiday}<br>年末は ごみが多くなります。収集日の朝8時までに出してください。</div>`;
  return h;
}

/* ================= 画面: よてい ================= */

  const now = new Date();
  let h = backBtn() + '<h1>よてい</h1>';
  if (st.city==='taka'){
    h += `<div class="box"><h2>お住まいの場所(地区${st.area+1})</h2><div class="small" style="font-size:17px">${A().p}</div></div>`;
  }
  let rows=''; for (let i=0;i<7;i++) rows += dayRow(addDays(now,i));
  h += `<div class="box"><h2>これから7日間</h2>${rows}</div>`;
  const legend = C().order.map(k=>`<span class="chip ${T()[k].cls}">${T()[k].short} ${T()[k].label}</span>`).join('');
  h += `<div class="box"><div class="mh"><button data-act="prev">‹</button><span id="mlabel"></span><button data-act="next">›</button></div><div class="cal" id="cal"></div>
        <div class="legend">${legend}</div></div>`;
  if (!window.claude && !NATIVE){
    h += `<div class="box"><h2>スマホのカレンダーに入れる</h2>
      <div class="small">1年分のごみの日が入ります。前日の夜7時と、当日の朝6時半に音でお知らせします。ご家族の方が1回設定すれば大丈夫です。</div>
      <button class="btn" data-act="ics">カレンダーに登録する</button>
      <div class="small" style="margin-top:8px">※2回押すと二重に入ります。お知らせの音は、スマホの設定で変わることがあります。</div></div>`;
  }
  h += `<details class="plain"><summary>出し方のルール</summary><ul>
      <li>収集日の<b>朝8時まで</b>に、決められたごみ集積所へ。</li>
      <li>もやせる/もやせないごみは<b>指定袋</b>を使い、どちらかにチェックして氏名を記入。混ぜると収集されません。</li>
      <li>資源ごみ・有害危険ごみなどは、中身が見える45ℓ以下の透明・半透明袋で。</li>
      <li>粗大ごみは事前申込制。高北清掃センター 44-8853。</li></ul></details>`;
  return h;
}
function renderCal(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('mlabel').textContent = `${y}年${m+1}月`;
  const first = new Date(y,m,1).getDay(), last = new Date(y,m+1,0).getDate(), today = new Date();
  let h = W.map(w=>`<div class="h">${w}</div>`).join('');
  for (let i=0;i<first;i++) h += '<div class="c e"></div>';
  for (let d=1; d<=last; d++){
    const date = new Date(y,m,d), t = collect(date);
    h += `<div class="c${sameDay(date,today)?' today':''}${t===null?' off':''}"><span class="n">${d}</span>${(t||[]).map(k=>`<i class="${T()[k].cls}">${T()[k].short}</i>`).join('')}</div>`;
  }
  document.getElementById('cal').innerHTML = h;
}

/* ================= 描画・操作 ================= */
let shown = null;
function render(){
  if (!st && screen!=='setup') screen = 'setup';
  const f = {home:homeHTML, search:searchHTML, plan:planHTML, ny:nyHTML, battery:batteryHTML, contact:contactHTML, extra:extraHTML, danger:dangerHTML, carry:carryHTML, settings:settingsHTML, setup:setupHTML}[screen];
  const y = window.scrollY || 0, same = (shown === screen);
  $app.innerHTML = f();
  if (screen==='plan') renderCal();
  window.scrollTo(0, same ? y : 0);
  shown = screen;
}
function go(s){
  if (s==='setup') setup = {step:'city', town:null, city:null};
  screen = s; render();
}
$app.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if (g){ go(g.dataset.go); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act){
    case 'city':
      setup.city = v;
      setup.step = (v==='kita') ? 'town' : 'area';
      render(); break;
    case 'town': {
      const list = CITY.kita.areas.map((a,i)=>i).filter(i=>CITY.kita.areas[i].town===v);
      if (list.length===1){ st = {city:'kita', area:list[0]}; save(); screen='home'; render(); scheduleNotices(); }
      else { setup.town=v; setup.step='area'; render(); }
      break; }
    case 'area': st = {city:setup.city||'kita', area:+v}; save(); screen='home'; render(); scheduleNotices(); break;
    case 'setupback': setup.step='city'; setup.city=null; render(); break;
    case 'towns': setup.step='town'; render(); break;
    case 'quick': query = v; kana = null; render(); break;
    case 'kana': kana = (kana===v ? null : v); query = ''; render(); break;
    case 'clearq': query=''; kana=null; render(); { const q=document.getElementById('q'); if(q) q.focus(); } break;
    case 'prev': view = new Date(view.getFullYear(), view.getMonth()-1, 1); renderCal(); break;
    case 'next': view = new Date(view.getFullYear(), view.getMonth()+1, 1); renderCal(); break;
    case 'ics': downloadICS(); break;
    case 'hmore': query = hq; kana = null; go('search'); break;
    case 'hclear': hq = ''; render(); { const q = document.getElementById('hq'); if (q) q.focus(); } break;
    case 'snd_on': prefs.snd = true; savePrefs(); sfx('ok'); render(); break;
    case 'snd_off': prefs.snd = false; savePrefs(); render(); break;
    case 'size': prefs.size = +v; savePrefs(); applySize(); render(); break;
    case 'ntest': testNotice(); break;
    case 'non': setNotice(true); break;
    case 'noff': setNotice(false); break;
  }
});
$app.addEventListener('change', e=>{
  if (e.target.id==='ntime'){ const [hh,mm] = e.target.value.split(':').map(Number); nf.h=hh; nf.m=mm; saveNf(); scheduleNotices().then(render); }
});
$app.addEventListener('input', e=>{
  if (e.target.id==='hq'){ hq = e.target.value; document.getElementById('hres').innerHTML = homeResultsHTML(); }
  if (e.target.id==='q'){ query = e.target.value; if (query.trim()) kana = null; document.getElementById('results').innerHTML = resultsHTML(); }
});

/* ================= カレンダー登録(.ics): 自分のサイトに置いた場合に使えます ================= */
function fold(line){
  const enc = new TextEncoder(); let out='', cur='', bytes=0;
  for (const ch of line){
    const b = enc.encode(ch).length;
    if (bytes+b>75){ out += cur+'\r\n'; cur=' '; bytes=1; }
    cur += ch; bytes += b;
  }
  return out+cur;
}
const esc = s => s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const p2 = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
function buildICS(){
  const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const stamp = `${now.getUTCFullYear()}${p2(now.getUTCMonth()+1)}${p2(now.getUTCDate())}T${p2(now.getUTCHours())}${p2(now.getUTCMinutes())}${p2(now.getUTCSeconds())}Z`;
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kitaibaraki-gomi//JP','CALSCALE:GREGORIAN','X-WR-CALNAME:'+esc(C().name+' ごみの日('+placeLabel()+')')];
  for (let i=0;i<365;i++){
    const d = addDays(start,i), t = collect(d);
    if (!t || !t.length) continue;
    const names = t.map(k=>T()[k].label).join('と');
    const desc = t.map(k=>T()[k].label+': '+T()[k].memo).join('\n')+'\n朝8時までに出してください。';
    L.push('BEGIN:VEVENT',`UID:gomi-${st.city}-${st.area}-${ymd(d)}@kitaibaraki-gomi`,`DTSTAMP:${stamp}`,
      `DTSTART:${ymd(d)}T063000`,`DTEND:${ymd(d)}T080000`,'SUMMARY:'+esc('ごみの日: '+names),'DESCRIPTION:'+esc(desc),
      'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT11H30M','DESCRIPTION:'+esc('あしたの朝は '+names+' の日です'),'END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0S','DESCRIPTION:'+esc('きょうは '+names+' の日です(朝8時まで)'),'END:VALARM','END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}
function downloadICS(){
  const blob = new Blob([buildICS()], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = 'gomi-calendar.ics';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}
